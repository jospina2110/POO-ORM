services:
  mysql:
    image: mysql:8.4
    container_name: motogp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secreto}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-motogp_db}
      MYSQL_USER: ${MYSQL_USER:-motogp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-motogp_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secreto"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  mysql_data: